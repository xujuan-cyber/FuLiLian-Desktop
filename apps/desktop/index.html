<!doctype html>
<html lang="en">
  <head>
    <!-- P13: earliest renderer boot mark (HTML parse start) → main-process desktop.log via the preload bridge. -->
    <script>try{window.fulilianDesktop?.reportBootMark?.('boot:html-parse',Math.round(performance.timeOrigin+performance.now()))}catch{}</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- GENERATED:prepaint — the content below is injected at build time from
         themes/presets.ts (DEFAULT_SKIN_NAME → chromeBackground, dark
         candidate) via the vite.config.ts transformIndexHtml plugin. An
         unreplaced token is not a valid color, so a file served without the
         build transform honestly falls back to the UA default. Do not
         hand-edit a hex here — edit presets.ts. -->
    <meta name="theme-color" content="__FULILIAN_PREPAINT_DARK__" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />
    <title>Fulilian</title>
    <script>
      // Pre-paint the themed background before the app bundle loads. Without
      // this, the first frame (which is what `ready-to-show` waits for) is the
      // UA-default white page, and the real theme only lands once the whole
      // module graph has executed — i.e. the "white flash" on every new
      // window. applyTheme() in src/themes/context.tsx keeps these keys fresh.
      try {
        let bg = localStorage.getItem('fulilian-boot-background')
        let scheme = localStorage.getItem('fulilian-boot-color-scheme')
        if (!bg) {
          // GENERATED:prepaint — the two fallback hexes below are injected at
          // build time from themes/presets.ts (DEFAULT_SKIN_NAME →
          // chromeBackground in themes/chrome-background.ts) via the
          // vite.config.ts transformIndexHtml plugin; the runtime keys come
          // from applyTheme() in themes/context.tsx, which shares that module.
          // Edit presets.ts, never this file: hand-written hexes here drifted
          // silently and made the very first launch flash the previous skin.
          // Unreplaced tokens are invalid CSS colors, so a file served without
          // the build transform paints the UA default instead of a stale skin.
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          bg = dark ? '__FULILIAN_PREPAINT_DARK__' : '__FULILIAN_PREPAINT_LIGHT__'
          scheme = dark ? 'dark' : 'light'
        }
        document.documentElement.style.backgroundColor = bg
        if (scheme === 'dark' || scheme === 'light') {
          document.documentElement.style.colorScheme = scheme
        }
      } catch {
        // localStorage unavailable — keep UA defaults.
      }
    </script>
  </head>
  <body>
    <div id="root" class="scrollbar-dt"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
